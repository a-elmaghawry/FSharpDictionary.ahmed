<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>F# Dictionary</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="container">
    <h1>Dictionary App (F#)</h1>
    <div class="controls">
      <input id="search" placeholder="Search term / definition / tag" />
      <button onclick="doSearch()">Search</button>
      <button onclick="loadAll()">Load All</button>
    </div>
    <div id="results" class="card"></div>
    <div class="card">
      <h3>Add / Update</h3>
      <input id="term" placeholder="Term" />
      <textarea id="definition" placeholder="Definition"></textarea>
      <input id="tags" placeholder="tags (comma separated)" />
      <button onclick="addWord()">Add</button>
      <button onclick="updateWord()">Update</button>
    </div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
